<!--
  Service schema blocks removed from index.html while Scrubbed, Cleaned and
  Marked are paused on the Swept website. To bring a service back, paste its
  block back into index.html (after the other service schemas) and remove
  `paused: true` from that service in src/serviceBrands.ts.
-->

    <!-- Scrubbed — Floor Scrubbing Service Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "Commercial Floor Scrubbing Gold Coast — Scrubbed by Swept",
      "provider": {
        "@id": "%VITE_SITE_URL%/#business"
      },
      "description": "Commercial floor scrubbing on the Gold Coast and across South East Queensland, including warehouse floor scrubbing, industrial floor scrubbing, shopping centre floor cleaning and scheduled floor maintenance.",
      "areaServed": [
        {
          "@type": "City",
          "name": "Gold Coast"
        },
        {
          "@type": "AdministrativeArea",
          "name": "South East Queensland, Australia"
        }
      ],
      "serviceType": "Commercial Floor Scrubbing",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Scrubbed by Swept — Floor Scrubbing Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {

            }
          },
          {

              "@type": "Service",
              "name": "Commercial Hard-Floor Cleaning"
            }
          },
          {

              "@type": "Service",
              "name": "Machine Scrubbing & Drying"
            }
          },
          {

              "@type": "Service",
              "name": "Scheduled Floor Maintenance"
            }
          }
        ]
      },
      "url": "%VITE_SITE_URL%/#scrubbed"
